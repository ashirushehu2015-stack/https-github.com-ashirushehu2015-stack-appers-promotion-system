databases:
  - name: appers-postgres
    databaseName: appers_db
    user: appers_user
    plan: free

services:
  # Redis Cache & Queue (Managed Service)
  - type: keyvalue
    name: appers-redis
    plan: free
    ipAllowList: []

  # Django Backend Web Service
  - type: web
    name: appers-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: appers-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: appers-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        value: "your-secure-32-byte-base64-encryption-key="

  # React Frontend SPA (Static Site)
  - type: web
    name: appers-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    plan: free
    headers:
      - path: "/*"
        name: "X-Frame-Options"
        value: "DENY"
      - path: "/*"
        name: "X-Content-Type-Options"
        value: "nosniff"
