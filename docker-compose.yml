version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: appers_db
    environment:
      POSTGRES_DB: appers_db
      POSTGRES_USER: appers_user
      POSTGRES_PASSWORD: appers_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appers_user -d appers_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: appers_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appers_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-secret-key-change-this
      - DATABASE_URL=postgres://appers_user:appers_pass@db:5432/appers_db
      - REDIS_URL=redis://redis:6379/0
      - FIELD_ENCRYPTION_KEY=your-32-byte-base64-encryption-key=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appers_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://appers_user:appers_pass@db:5432/appers_db
      - REDIS_URL=redis://redis:6379/0
      - FIELD_ENCRYPTION_KEY=your-32-byte-base64-encryption-key=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appers_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://appers_user:appers_pass@db:5432/appers_db
      - REDIS_URL=redis://redis:6379/0
      - FIELD_ENCRYPTION_KEY=your-32-byte-base64-encryption-key=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
